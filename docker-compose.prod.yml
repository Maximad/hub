services:
  db:
    image: postgres:16
    container_name: hub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - hub_db_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: hub-web
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "127.0.0.1:8899:8000"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.hub.rule=Host(`hubsweida.jwtalenthouse.com`)"
      - "traefik.http.routers.hub.entrypoints=web"
      - "traefik.http.services.hub.loadbalancer.server.port=8000"
      - "traefik.http.routers.hub-secure.rule=Host(`hubsweida.jwtalenthouse.com`)"
      - "traefik.http.routers.hub-secure.entrypoints=websecure"
      - "traefik.http.routers.hub-secure.tls=true"
      - "traefik.http.routers.hub-secure.tls.certresolver=letsencrypt"

  management-mcp:
    build: .
    container_name: hub-management-mcp
    restart: unless-stopped
    command: >-
      uvicorn hub_mcp.app:app
      --host 0.0.0.0
      --port 8001
      --proxy-headers
      --forwarded-allow-ips=*
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "127.0.0.1:8900:8001"
    networks:
      - default
      - proxy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8001), 2); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  internet-worker:
    build: .
    container_name: hub-internet-worker
    restart: unless-stopped
    command: >-
      python manage.py run_internet_worker
      --network-interval 5
      --lifecycle-interval 60
      --network-limit 25
      --lifecycle-limit 200
    env_file:
      - .env
    depends_on:
      - db
    stop_grace_period: 20s
    networks:
      - default

  notification-worker:
    build: .
    container_name: hub-notification-worker
    restart: unless-stopped
    command: >-
      python manage.py run_notification_worker
      --interval 5
      --limit 50
    env_file:
      - .env
    depends_on:
      - db
    stop_grace_period: 20s
    networks:
      - default

volumes:
  hub_db_data:

networks:
  proxy:
    external: true
