<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>الاتصال بالإنترنت</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f4ef;color:#161616}
    main{max-width:32rem;padding:2rem;text-align:center}
    button{font:inherit;padding:.8rem 1.2rem;border-radius:.7rem;border:0;cursor:pointer}
    p{line-height:1.7}
  </style>
</head>
<body>
<main>
  <h1>جارٍ توصيلك بالشبكة…</h1>
  <p>سيتم تحويل جهازك إلى شبكة الإنترنت تلقائياً.</p>
  <form id="hotspot-login" method="post" action="{{ login_url }}" autocomplete="off" data-csrf-audit="external-post">
    <input type="hidden" name="username" value="{{ username }}">
    <input type="hidden" name="password" value="{{ password }}">
    <input type="hidden" name="dst" value="{{ destination_url }}">
    <input type="hidden" name="popup" value="false">
    <noscript><button type="submit">اتصل بالإنترنت</button></noscript>
  </form>
</main>
<script>document.getElementById('hotspot-login').submit();</script>
</body>
</html>
