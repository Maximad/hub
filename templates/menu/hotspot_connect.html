<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>الاتصال بالإنترنت</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#15181C;color:#F3F1EC;color-scheme:dark}
    main{box-sizing:border-box;width:min(100% - 32px,32rem);padding:2rem;text-align:center;border:1px solid #414A52;border-radius:18px;background:#1E2329}
    button{font:inherit;padding:.8rem 1.2rem;border-radius:.7rem;border:0;cursor:pointer;background:#24C6B2;color:#10201F;font-weight:700;min-height:48px}button:focus-visible{outline:3px solid #24C6B2;outline-offset:3px}
    p{line-height:1.7}
  </style>
</head>
<body>
<main>
  <h1>جارٍ توصيلك بالشبكة…</h1>
  <p>يجري توصيل جهازك تلقائياً. بعد الاتصال ستعود إلى هَبّ.</p>
  <form id="hotspot-login" method="post" action="{{ login_url }}" autocomplete="off" data-csrf-audit="external-post">
    <input type="hidden" name="username" value="{{ username }}">
    <input type="hidden" name="password" value="{{ password }}">
    <input type="hidden" name="dst" value="{{ destination_url }}">
    <input type="hidden" name="popup" value="false">
    <button type="submit">لم يتم الاتصال؟ أعد المحاولة</button>
  </form>
</main>
<script>document.getElementById('hotspot-login').submit();</script>
</body>
</html>
