{% extends "base.html" %}
{% block content %}<h2 class="hub-page-header__title">حجز جديد</h2>{% if error %}<p class="hub-message hub-message-error">{{ error }}</p>{% endif %}{% if errors %}{% for field,msgs in errors.items %}<p class="hub-message hub-message-error">{{ msgs|join:', ' }}</p>{% endfor %}{% endif %}
<form class="hub-form-section" method="post" data-reservation-form>{% csrf_token %}
<label>نوع الحجز<select name="reservation_type" id="reservation-type">{% for v,l in types %}<option value="{{ v }}" {% if form_values.reservation_type == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
<input name="name" value="{{ form_values.name|default:'' }}" required placeholder="الاسم"><input name="phone" value="{{ form_values.phone|default:'' }}" required placeholder="الهاتف">
<div data-reservation-group="regular"><input type="date" name="reservation_date" value="{{ form_values.reservation_date|default:'' }}" data-required-when-visible><input type="time" name="start_time" value="{{ form_values.start_time|default:'' }}" data-required-when-visible><input type="time" name="end_time" value="{{ form_values.end_time|default:'' }}">
<label>المساحة<select name="room" id="reservation-room" data-hub-searchable-select="true"><option value="">اختر المساحة</option>{% for room in rooms %}<option value="{{ room.id }}" {% if form_values.room == room.id|stringformat:'s' %}selected{% endif %}>{{ room }}</option>{% endfor %}</select></label>
<label>الطاولة (اختياري)<select name="table_area" id="reservation-table" data-hub-searchable-select="true"><option value="">بدون طاولة</option>{% for a in table_areas %}<option value="{{ a.id }}" data-room-id="{{ a.room_id }}" {% if form_values.table_area == a.id|stringformat:'s' %}selected{% endif %}>{{ a }}</option>{% endfor %}</select></label></div>
<div data-reservation-group="event"><label>الفعالية<select name="event" id="reservation-event" data-hub-searchable-select="true" data-required-when-visible><option value="">اختر الفعالية</option>{% for e in events %}<option value="{{ e.id }}" data-date="{{ e.starts_at|date:'Y-m-d' }}" data-time="{{ e.starts_at|time:'H:i' }}{% if e.ends_at %}–{{ e.ends_at|time:'H:i' }}{% endif %}" data-room="{{ e.room|default:'-' }}" {% if form_values.event == e.id|stringformat:'s' %}selected{% endif %}>{{ e.title_ar }} — {{ e.starts_at|date:'Y-m-d H:i' }} — {{ e.room|default:'-' }}</option>{% endfor %}</select></label><p id="event-schedule" aria-live="polite"></p></div>
<select name="status">{% for v,l in statuses %}<option value="{{ v }}" {% if form_values.status == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
<input type="number" min="1" name="party_size" value="{{ form_values.party_size|default:'1' }}"><textarea name="notes" placeholder="ملاحظات">{{ form_values.notes|default:'' }}</textarea><button>حفظ</button></form>{% endblock %}
