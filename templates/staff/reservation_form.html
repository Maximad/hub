{% extends "base.html" %}
{% block content %}<h2 class="hub-page-header__title">حجز جديد</h2>{% if error %}<p class="hub-message hub-message-error">{{ error }}</p>{% endif %}{% if errors %}{% for field,msgs in errors.items %}<p class="hub-message hub-message-error">{{ msgs|join:', ' }}</p>{% endfor %}{% endif %}
<form class="hub-form-section" method="post" data-reservation-form>{% csrf_token %}
<label>نوع الحجز<select name="reservation_type" id="reservation-type">{% for v,l in types %}<option value="{{ v }}" {% if form_values.reservation_type == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></label>
<label for="reservation-name">اسم صاحب الحجز <span aria-hidden="true">*</span></label><input id="reservation-name" name="name" value="{{ form_values.name|default:'' }}" required autocomplete="name" placeholder="الاسم">
<label for="reservation-phone">هاتف التواصل <span aria-hidden="true">*</span></label><input id="reservation-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" value="{{ form_values.phone|default:'' }}" required placeholder="الهاتف">
<div data-reservation-group="regular" role="group" aria-label="موعد الحجز العادي">
<label for="reservation-date">تاريخ الحجز <span aria-hidden="true">*</span></label><input type="date" id="reservation-date" name="reservation_date" value="{{ form_values.reservation_date|default:'' }}" data-required-when-visible>
<label for="reservation-start-time">وقت البداية <span aria-hidden="true">*</span></label><input type="time" id="reservation-start-time" name="start_time" value="{{ form_values.start_time|default:'' }}" data-required-when-visible>
<label for="reservation-end-time">وقت النهاية (اختياري)</label><input type="time" id="reservation-end-time" name="end_time" value="{{ form_values.end_time|default:'' }}">
<label>المساحة<select name="room" id="reservation-room" data-hub-searchable-select="true"><option value="">اختر المساحة</option>{% for room in rooms %}<option value="{{ room.id }}" {% if form_values.room == room.id|stringformat:'s' %}selected{% endif %}>{{ room }}</option>{% endfor %}</select></label>
<label>الطاولة (اختياري)<select name="table_area" id="reservation-table" data-hub-searchable-select="true"><option value="">بدون طاولة</option>{% for a in table_areas %}<option value="{{ a.id }}" data-room-id="{{ a.room_id }}" {% if form_values.table_area == a.id|stringformat:'s' %}selected{% endif %}>{{ a }}</option>{% endfor %}</select></label></div>
<div data-reservation-group="event"><label>الفعالية<select name="event" id="reservation-event" data-hub-searchable-select="true" data-required-when-visible><option value="">اختر الفعالية</option>{% for e in events %}<option value="{{ e.id }}" data-date="{{ e.starts_at|date:'Y-m-d' }}" data-time="{{ e.starts_at|time:'H:i' }}{% if e.ends_at %}–{{ e.ends_at|time:'H:i' }}{% endif %}" data-room="{{ e.room|default:'-' }}" {% if form_values.event == e.id|stringformat:'s' %}selected{% endif %}>{{ e.title_ar }} — {{ e.starts_at|date:'Y-m-d H:i' }} — {{ e.room|default:'-' }}</option>{% endfor %}</select></label><p id="event-schedule" aria-live="polite"></p>
<label>العرض / موعد الحضور<select name="performance" id="reservation-performance">
<option value="">اختر العرض (مطلوب عند تعدد العروض)</option>
{% for p in performances %}
<option value="{{ p.id }}" data-event-id="{{ p.event_id }}" {% if form_values.performance == p.id|stringformat:'s' %}selected{% endif %}>{{ p.event.title_ar }} — {{ p.starts_at|date:'Y-m-d H:i' }}</option>
{% endfor %}
</select></label>
</div>
<label for="reservation-status">حالة الحجز</label><select id="reservation-status" name="status">{% for v,l in statuses %}<option value="{{ v }}" {% if form_values.status == v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select>
<label for="reservation-party-size">عدد الضيوف</label><input type="number" min="1" id="reservation-party-size" name="party_size" value="{{ form_values.party_size|default:'1' }}">
<label for="reservation-notes">ملاحظات (اختياري)</label><textarea id="reservation-notes" name="notes" placeholder="ملاحظات">{{ form_values.notes|default:'' }}</textarea><button>حفظ</button></form><script>
(function () {
  const eventSelect = document.getElementById('reservation-event');
  const performanceSelect = document.getElementById('reservation-performance');
  if (!eventSelect || !performanceSelect) return;
  function filterPerformances() {
    const event = eventSelect.value;
    let available = 0;
    for (const option of performanceSelect.options) {
      if (!option.value) continue;
      option.hidden = option.dataset.eventId !== event;
      option.disabled = option.hidden;
      if (!option.hidden) available += 1;
    }
    if (performanceSelect.value && performanceSelect.selectedOptions[0].hidden) performanceSelect.value = '';
    if (!performanceSelect.value && available === 1) {
      for (const option of performanceSelect.options) {
        if (option.value && !option.hidden) performanceSelect.value = option.value;
      }
    }
  }
  eventSelect.addEventListener('change', filterPerformances);
  filterPerformances();
})();
</script>{% endblock %}
