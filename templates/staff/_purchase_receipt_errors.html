{% if receipt_errors %}
<div class="hub-alert hub-alert--danger" role="alert" tabindex="-1" id="purchase-receipt-errors">
  <strong>تعذر تأكيد الاستلام</strong>
  <ul>{% for error in receipt_errors %}<li>{{ error }}</li>{% endfor %}</ul>
  <p>احتفظنا بالكميات المدخلة. راجع الكميات والمتبقي قبل إعادة التأكيد.</p>
</div>
{% endif %}
