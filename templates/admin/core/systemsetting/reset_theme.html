{% extends "admin/base_site.html" %}{% load i18n %}
{% block content %}<form method="post">{% csrf_token %}<div class="module aligned"><h2>استعادة الإعدادات الافتراضية</h2><p>سيتم استعادة حقول الواجهة والتصميم فقط. لن تتغير الطلبات أو الأسعار أو أي إعداد تشغيلي.</p>{% for object in queryset %}<input type="hidden" name="{{ action_checkbox_name }}" value="{{ object.pk }}">{% endfor %}<input type="hidden" name="action" value="reset_theme_defaults"><input type="hidden" name="confirm_theme_reset" value="yes"><button class="button default" type="submit" name="apply" value="yes">تأكيد الاستعادة</button> <a class="button" href="../">إلغاء</a></div></form>{% endblock %}
