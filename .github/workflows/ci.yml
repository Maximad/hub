name: Django CI

on:
  pull_request:
    # Drafts get fast feedback; ready_for_review starts the full release gate.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Draft PRs: fast, read-only checks without PostgreSQL services, Playwright,
  # Docker build, image publication, or deploying anything.
  fast-checks:
    name: Fast draft checks
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-django-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SECURE_SSL_REDIRECT: "false"
      MIKROTIK_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Django system check
        run: python manage.py check
      - name: Lightweight source and UI contract tests (no database)
        run: >-
          python manage.py test --noinput
          core.tests.test_hub_ui_v3_suite
          core.tests.test_public_charcoal.PublicCharcoalStaticContracts
          core.tests.test_staff_charcoal
          core.tests.test_ci_gates
      - name: Public menu pricing calculation
        run: node --test static/js/tests/menu_cart_pricing.test.js

  # Ready PRs and main get the unchanged full PostgreSQL + image + browser gate.
  # A changed ready PR runs it again for the new head, preventing stale checks.
  postgres-tests:
    name: PostgreSQL checks and tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hub
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-django-secret-key-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      MIKROTIK_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Production deploy script regression checks
        run: bash scripts/test-production-deploy.sh

      - name: Backup snapshot consistency under concurrent writes
        run: bash scripts/test-backup-snapshot.sh

      - name: Django system check
        run: python manage.py check

      - name: MCP bridge readiness probe
        run: python scripts/check-mcp-bridge.py

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to PostgreSQL
        run: python manage.py migrate --noinput

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Exercise Internet worker once
        run: python manage.py run_internet_worker --once

      - name: Exercise notification worker once
        run: python manage.py run_notification_worker --once

      - name: Internet readiness smoke check
        run: python manage.py internet_readiness --json

      - name: Push readiness smoke check
        run: python manage.py push_readiness --json

      - name: Hub v1 launch readiness smoke check
        run: python manage.py hub_v1_readiness --json

      - name: Verify public menu modifier estimate calculation
        run: node --test static/js/tests/menu_cart_pricing.test.js

      - name: Build release image with immutable static assets
        run: docker build --build-arg VCS_REF=${{ github.sha }} -t hub-tested:${{ github.sha }} .

      - name: Run full Django test suite on PostgreSQL
        run: >-
          docker run --rm --network host
          -e DJANGO_SETTINGS_MODULE -e DJANGO_DEBUG -e DJANGO_SECRET_KEY
          -e DJANGO_ALLOWED_HOSTS -e DJANGO_SECURE_SSL_REDIRECT
          -e DJANGO_SESSION_COOKIE_SECURE -e DJANGO_CSRF_COOKIE_SECURE
          -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_HOST -e POSTGRES_PORT
          -e MIKROTIK_ENABLED hub-tested:${{ github.sha }} python manage.py test --noinput

      - name: Audit runtime dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock --disable-pip --no-deps


      - name: Verify consumption mobile layout
        env:
          MOBILE_PREVIEW_DIR: ${{ runner.temp }}/hub-consumption-preview
          PYTHONPATH: .
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/check-consumption-mobile.py

      - name: Upload consumption mobile preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumption-mobile-preview
          path: ${{ runner.temp }}/hub-consumption-preview
          if-no-files-found: ignore

      - name: Verify public charcoal discovery layout
        env:
          PUBLIC_HOMEPAGE_PREVIEW_DIR: ${{ runner.temp }}/hub-public-charcoal-preview
          PYTHONPATH: .
        run: python scripts/check-public-homepage.py

      - name: Upload public charcoal screenshot previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-charcoal-preview
          path: ${{ runner.temp }}/hub-public-charcoal-preview
          if-no-files-found: ignore


      - name: Save tested release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save hub-tested:${{ github.sha }} | gzip > ${{ runner.temp }}/hub-image.tar.gz

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tested-release-image
          path: ${{ runner.temp }}/hub-image.tar.gz
          retention-days: 3

  publish-release:
    needs: postgres-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-release-image
      - name: Publish the tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gunzip -c hub-image.tar.gz | docker load
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag hub-tested:${{ github.sha }} ghcr.io/maximad/hub:${{ github.sha }}
          docker push ghcr.io/maximad/hub:${{ github.sha }}
          docker inspect ghcr.io/maximad/hub:${{ github.sha }} --format '{{index .RepoDigests 0}}' > release-image.txt
          cat release-image.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-digest
          path: release-image.txt
