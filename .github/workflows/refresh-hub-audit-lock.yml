name: One-time Hub audit dependency lock refresh
on:
  push:
    branches:
      - codex/hub-audit-remediation
    paths:
      - .github/workflows/refresh-hub-audit-lock.yml

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hub-audit-remediation
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and validate full hash-locked dependencies
        run: |
          python -m pip install -U pip uv pip-audit
          uv pip compile requirements.txt --python-version 3.12 --python-platform x86_64-unknown-linux-gnu --generate-hashes -o requirements.lock
          python -m pip install --require-hashes -r requirements.lock
          pip-audit -r requirements.lock --disable-pip --no-deps
          python - <<'PY'
          from io import BytesIO
          from PIL import Image
          from pywebpush import webpush
          from py_vapid import Vapid
          import cryptography
          v = Vapid()
          v.generate_keys()
          image = Image.new("RGBA", (64, 48), (12, 43, 140, 160))
          image.thumbnail((32, 32))
          data = BytesIO()
          image.save(data, format="WEBP")
          assert data.getvalue().startswith(b"RIFF")
          print("Offline Web Push key generation and Pillow WEBP thumbnail smoke: PASS")
          PY
      - name: Replace temporary workflow with reproducible lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-hub-audit-lock.yml
          git add requirements.lock requirements.txt
          git commit -m "build: lock patched crypto, Pillow and Web Push dependencies"
          git push origin HEAD:codex/hub-audit-remediation
      - name: Trigger complete post-lock CI at updated PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref codex/hub-audit-remediation
